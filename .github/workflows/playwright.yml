name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: self-hosted
    container:
      image: node:20-alpine
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Install Playwright system dependencies (Arch Linux)
        run: |
          sudo pacman -Sy --noconfirm \
            chromium \
            nss \
            nspr \
            atk \
            at-spi2-atk \
            libdrm \
            libxcomposite \
            libxdamage \
            libxfixes \
            libxrandr \
            libgbm \
            libxkbcommon \
            pango \
            cairo \
            alsa-lib \
            mesa

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium
      - name: Run Playwright tests
        run: pnpm exec playwright test