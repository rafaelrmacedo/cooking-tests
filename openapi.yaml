openapi: 3.0.3
info:
  title: Cooking-backend
  version: 1.0.0
  contact: {}
servers:
- url: 'http://localhost:3000/festive-calendar'
- url: 'http://localhost:3000/discount-policy'
- url: 'http://localhost:3000/auth'
- url: 'http://localhost:3000/hotels'
- url: 'http://localhost:3000/bookings'
- url: 'http://localhost:3000/rooms'
- url: 'http://localhost:3000/'
paths:
  /:
    get:
      tags:
      - App
      summary: Get Discount Policy
      description: Get Discount Policy
      operationId: getDiscountPolicy
      parameters:
      - name: hotelId
        in: query
        schema:
          type: string
          example: '{{hotelId}}'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                  example: Middle of Nowhere
                amenities:
                  type: array
                  items:
                    type: string
                    example: Wi-Fi
                  example:
                  - Wi-Fi
                  - Pool
                  - Gym
                city:
                  type: string
                  example: Bermuda Triangle
                country:
                  type: string
                  example: Ocean
                description:
                  type: string
                  example: Can u get them all?
                email:
                  type: string
                  example: nintendo@japan.com
                images:
                  type: array
                  items:
                    type: string
                    example: https://tenor.com/83SG.gif
                  example:
                  - https://tenor.com/83SG.gif
                isActive:
                  type: boolean
                  example: true
                location:
                  type: object
                  properties:
                    latitude:
                      type: number
                      example: 25
                    longitude:
                      type: number
                      example: -70
                name:
                  type: string
                  example: Best Hotel
                phone:
                  type: string
                  example: +55 21 99999-0000
                stars:
                  type: number
                  example: 5
            examples:
              Get All Rooms by Hotel:
                value: ''
              Get Discount Policy:
                value: ''
              Get Hotels:
                value:
                  address: Middle of Nowhere
                  amenities:
                  - Wi-Fi
                  - Pool
                  - Gym
                  city: Bermuda Triangle
                  country: Ocean
                  description: Can u get them all?
                  email: nintendo@japan.com
                  images:
                  - https://tenor.com/83SG.gif
                  isActive: true
                  location:
                    latitude: 25
                    longitude: -70
                  name: Best Hotel
                  phone: +55 21 99999-0000
                  stars: 5
      responses:
        '200':
          description: ''
    post:
      tags:
      - Rooms
      summary: Create Seasonal Price
      description: Create Seasonal Price
      operationId: createSeasonalPrice
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amenities:
                  type: array
                  items:
                    type: string
                    example: WiFi
                  example:
                  - WiFi
                  - Air Conditioning
                  - TV
                  - Mini Bar
                baseOccupancy:
                  type: number
                  example: 2
                beds:
                  type: object
                  properties:
                    double:
                      type: number
                      example: 1
                    king:
                      type: number
                      example: 0
                    queen:
                      type: number
                      example: 0
                    single:
                      type: number
                      example: 1
                description:
                  type: string
                  example: Quarto confortável com vista parcial para o oceano.
                extraAdultPrice:
                  type: number
                  example: 100
                extraChildPrice:
                  type: number
                  example: 50
                hotelId:
                  type: string
                  example: 697d5598b42fe36247550571
                images:
                  type: array
                  items: {}
                  example: []
                isAvailable:
                  type: boolean
                  example: true
                maxOccupancy:
                  type: number
                  example: 3
                pricePerNight:
                  type: number
                  example: 420
                roomNumber:
                  type: string
                  example: '101'
                size:
                  type: number
                  example: 28
                type:
                  type: string
                  example: Deluxe
            examples:
              Create Booking:
                value:
                  adultsCount: 6
                  childAges:
                  - 3
                  - 4
                  endDate: 2026-02-17
                  roomIds:
                  - '{{roomId}}'
                  startDate: 2026-02-13
              Create Discount Policy (Children):
                value:
                  conditions:
                    maxAge: 8
                    maxFreeChildren: 1
                  discountPercentage: 100
                  hotelId: '{{hotelId}}'
                  isActive: true
                  type: CHILDREN_DISCOUNT
              Create Discount Policy (Group):
                value:
                  conditions:
                    minCount: 6
                  discountPercentage: 10
                  hotelId: '{{hotelId}}'
                  isActive: true
                  type: GROUP_DISCOUNT
              Create Hotel:
                value:
                  address: Middle of Nowhere
                  amenities:
                  - Wi-Fi
                  - Pool
                  - Gym
                  city: Bermuda Triangle
                  country: Ocean
                  description: Can u get them all?
                  email: nintendo@japan.com
                  images:
                  - https://tenor.com/83SG.gif
                  isActive: true
                  location:
                    latitude: 25
                    longitude: -70
                  name: Best Hotel
                  phone: +55 21 99999-0000
                  stars: 5
              Create Room:
                value:
                  amenities:
                  - WiFi
                  - Air Conditioning
                  - TV
                  - Mini Bar
                  baseOccupancy: 2
                  beds:
                    double: 1
                    king: 0
                    queen: 0
                    single: 1
                  description: Quarto confortável com vista parcial para o oceano.
                  extraAdultPrice: 100
                  extraChildPrice: 50
                  hotelId: 697d5598b42fe36247550571
                  images: []
                  isAvailable: true
                  maxOccupancy: 3
                  pricePerNight: 420
                  roomNumber: '101'
                  size: 28
                  type: Deluxe
              Create Seasonal Price:
                value:
                  city: Rio de Janeiro
                  cityId: 60d5ec49f1b2c8b1f8e4e123
                  description: Carnaval Rio de Janeiro - Alta temporada
                  endDate: 2026-02-17T00:00:00.000Z
                  isActive: true
                  priceAdjustmentPercentage: 150
                  scope: CITY
                  startDate: 2026-02-13T00:00:00.000Z
      responses:
        '200':
          description: ''
  /register:
    post:
      tags:
      - User
      summary: Register
      description: Register
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: Teste@test.com
                name:
                  type: string
                  example: Test User
                password:
                  type: string
                  example: suasenha
            examples:
              Register:
                value:
                  email: Teste@test.com
                  name: Test User
                  password: suasenha
      responses:
        '200':
          description: ''
  /login:
    post:
      tags:
      - User
      summary: Login
      description: Login
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: Teste@test.com
                name:
                  type: string
                  example: Test User
                password:
                  type: string
                  example: suasenha
            examples:
              Login:
                value:
                  email: Teste@test.com
                  name: Test User
                  password: teste123123
      responses:
        '201':
          description: Valid credentials
          content:
            application/json:
              schema:
                type: object
                required: [access_token]
                properties:
                  access_token:
                    type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                required: [message, error, statusCode]
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  statusCode:
                    type: number
  /profile:
    get:
      tags:
      - User
      summary: Profile
      description: Profile
      operationId: profile
      requestBody:
        content:
          application/json:
            examples:
              Profile:
                value: ''
      responses:
        '200':
          description: ''
  /summary:
    post:
      tags:
      - Booking
      summary: Booking Summary
      description: Booking Summary
      operationId: bookingSummary
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                adultsCount:
                  type: number
                  example: 6
                childAges:
                  type: array
                  items:
                    type: number
                    example: 3
                  example:
                  - 3
                  - 4
                endDate:
                  type: string
                  example: 2026-02-17
                roomIds:
                  type: array
                  items:
                    type: string
                    example: '{{roomId}}'
                  example:
                  - '{{roomId}}'
                startDate:
                  type: string
                  example: 2026-02-13
            examples:
              Booking Summary:
                value:
                  adultsCount: 6
                  childAges:
                  - 3
                  - 4
                  endDate: 2026-02-17
                  roomIds:
                  - '{{roomId}}'
                  startDate: 2026-02-13
      responses:
        '200':
          description: ''
  /{bookingId}/cancel:
    post:
      tags:
      - Booking
      summary: Cancel Booking
      description: Cancel Booking
      operationId: cancelBooking
      requestBody:
        content:
          application/json:
            examples:
              Cancel Booking:
                value: ''
      responses:
        '200':
          description: ''
    parameters:
    - name: bookingId
      in: path
      required: true
      schema:
        type: string
  /{roomId}/check-availability:
    get:
      tags:
      - Rooms
      summary: Check Room Avaliabity
      description: Check Room Avaliabity
      operationId: checkRoomAvaliabity
      parameters:
      - name: checkInDate
        in: query
        schema:
          type: string
          example: 2026-03-20
      - name: checkOutDate
        in: query
        schema:
          type: string
          example: 2026-03-25
      requestBody:
        content:
          application/json:
            examples:
              Check Room Avaliabity:
                value: ''
      responses:
        '200':
          description: ''
    parameters:
    - name: roomId
      in: path
      required: true
      schema:
        type: string
tags:
- name: Promotions
- name: Festival Calendar
- name: Discount Policy
- name: User
- name: Hotel
- name: Booking
- name: Rooms
- name: App

